<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <!-- 站名由 /api/status 的 system_name 在运行时覆盖，此处仅为回落值 -->
    <title>llmuni</title>
    <meta name="description" content="统一的 AI 模型接口平台" />
    <meta name="theme-color" content="#3BCAF5" />
    <script>
      // 首屏前套用主题，避免闪烁（FOUC）。回落值必须与 stores/theme.ts 一致：
      // 默认浅色，只有用户显式选过才可能是 dark/system
      ;(function () {
        try {
          var t = localStorage.getItem('onestep-theme') || 'light'
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
